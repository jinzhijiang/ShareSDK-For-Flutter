group 'com.mob.flutter.sharesdk'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def mobCompileSdkVersion = 34
try {
    mobCompileSdkVersion = flutter.compileSdkVersion
    if (rootProject.hasProperty("zzt-compileSdkVersion")) {
        mobCompileSdkVersion = Integer.parseInt(rootProject.getProperty('zzt-compileSdkVersion'))
    }
} catch (Throwable ignored) {
}

def mobTargetSdkVersion = 34
try {
    mobTargetSdkVersion = flutter.targetSdkVersion
    if (rootProject.hasProperty("zzt-targetSdkVersion")) {
        mobTargetSdkVersion = Integer.parseInt(rootProject.getProperty('zzt-targetSdkVersion'))
    }
} catch (Throwable ignored) {
}

android {
    namespace 'com.mob.flutter.sharesdk'
    compileSdk mobCompileSdkVersion

    lint {
        disable 'InvalidPackage'
    }

    defaultConfig {
        minSdk 16
        targetSdk mobTargetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    compileOnly fileTree(include: ['*.jar', '*.aar'], dir: 'libs', excludes: [])
}
